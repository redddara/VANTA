<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thermite Door Practice</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/practice.css">
  <style>
    body.thermite-page {
      margin: 0;
      min-height: 100vh;
      background: #0b0a08;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }
    a.back {
      position: fixed;
      top: 1rem;
      left: 1rem;
      color: var(--primary-color, #d4af37);
      text-decoration: none;
      z-index: 10;
    }
    a.back:hover { text-decoration: underline; }
    .mode-picker {
      width: 720px;
      max-width: 96vw;
      margin-bottom: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
    }
    .mode-btn {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: linear-gradient(135deg, rgba(15, 30, 45, 0.95), rgba(30, 60, 90, 0.95));
      color: #e0e0e0;
      font-family: 'Share Tech Mono', Consolas, monospace;
      cursor: pointer;
      text-align: left;
    }
    .mode-btn strong { display: block; color: var(--primary-color, #d4af37); margin-bottom: 0.2rem; }
    .mode-btn span { font-size: 12px; color: rgba(255,255,255,0.55); line-height: 1.35; }
    .mode-btn.is-active {
      border-color: var(--primary-color, #d4af37);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.35);
    }
    .custom-panel {
      width: 720px;
      max-width: 96vw;
      margin-bottom: 1rem;
      padding: 1rem 1.1rem;
      border-radius: 10px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      background: rgba(20, 16, 7, 0.92);
      display: none;
      gap: 0.85rem;
    }
    .custom-panel.is-visible { display: grid; }
    .custom-panel label {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }
    .custom-panel select {
      padding: 0.55rem 0.65rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #0f0c08;
      color: #f5f5f5;
      font: inherit;
    }
    .custom-panel .custom-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.65rem;
      grid-column: 1 / -1;
    }
    .custom-panel button {
      padding: 0.55rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      background: #0f0c08;
      color: #f5f5f5;
      cursor: pointer;
      font: inherit;
    }
    .custom-panel button.primary {
      border-color: var(--primary-color, #d4af37);
      color: var(--primary-color, #d4af37);
      background: rgba(212, 175, 55, 0.12);
    }
    .custom-panel .speed-note {
      grid-column: 1 / -1;
      margin: 0;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.45;
    }
    #rhythm-container { display: none; }
    #rhythm-container.active { display: flex !important; }
    #result {
      margin-top: 1rem;
      font-family: 'Share Tech Mono', Consolas, monospace;
      font-weight: 600;
      min-height: 1.5rem;
      text-align: center;
    }
    #result.ok { color: var(--primary-color, #d4af37); }
    #result.fail { color: var(--failure-color, #b22222); }
  </style>
</head>
<body class="thermite-page theme-classic">
  <a class="back" href="index.html">← All practice games</a>

  <div class="mode-picker" id="mode-picker">
    <button type="button" class="mode-btn is-active" data-mode="standard">
      <strong>In-game (45 hits)</strong>
      <span>True speed · 1 wrong · 3 misses</span>
    </button>
    <button type="button" class="mode-btn" data-mode="unlimited">
      <strong>Unlimited</strong>
      <span>True speed · score until you fail</span>
    </button>
    <button type="button" class="mode-btn" data-mode="custom">
      <strong>Beginner / Custom</strong>
      <span>Forgiving · 1×–3× speed</span>
    </button>
  </div>

  <div class="custom-panel" id="custom-panel">
    <p class="speed-note">Speed guide: <strong>1×</strong> is slowest for learning keys · <strong>2×</strong> is medium · <strong>3×</strong> is the exact in-game thermite speed.</p>
    <label>
      Speed
      <select id="custom-speed">
        <option value="1" selected>1× — slowest (learn keys)</option>
        <option value="2">2× — medium</option>
        <option value="3">3× — true in-game speed</option>
      </select>
    </label>
    <label>
      Forgiving mode
      <select id="custom-forgiving">
        <option value="yes" selected>Yes — never fail on wrong/miss</option>
        <option value="no">No — fail like in-game</option>
      </select>
    </label>
    <label>
      Session goal
      <select id="custom-session">
        <option value="unlimited" selected>Unlimited hits (Esc to stop)</option>
        <option value="goal45">Win at 45 hits</option>
      </select>
    </label>
    <div class="custom-actions">
      <button type="button" id="custom-start" class="primary">Start practice</button>
    </div>
  </div>

  <div id="rhythm-container" class="game-container">
    <div class="rhythm-display">
      <div class="rhythm-highway"></div>
      <div class="hit-zone"></div>
      <div class="key-indicators"></div>
    </div>
    <div class="hack-info">
      <div class="message"><span id="rhythm-message">Hit the keys right in time</span></div>
    </div>
    <div class="timer-container">
      <div class="timer-bar">
        <div class="rhythm-progress"></div>
      </div>
      <div class="timer-text" id="rhythm-timer-label">Progress: <span id="rhythm-progress">0</span>%</div>
    </div>
    <div class="key-help">
      <div id="rhythm-key-hint">Press keys to match falling notes</div>
    </div>
  </div>

  <div id="result"></div>

  <div class="audio-elements" style="display: none;">
    <audio id="sound-click" preload="auto" src="sounds/click.mp3"></audio>
    <audio id="sound-success" preload="auto" src="sounds/success.mp3"></audio>
    <audio id="sound-failure" preload="auto" src="sounds/failure.mp3"></audio>
    <audio id="sound-penalty" preload="auto" src="sounds/penalty.mp3"></audio>
    <audio id="sound-buttonPress" preload="auto" src="sounds/buttonPress.mp3"></audio>
  </div>

  <script src="js/practice-bridge.js"></script>
  <script src="js/theme-config.js"></script>
  <script src="js/apply-theme.js"></script>
  <script src="js/asset-base.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/jquery-3.6.0.min.js"></script>
  <script src="js/rhythm.js"></script>
  <script>
    var BASE = {
      lanes: 6,
      keys: ["A", "S", "D", "J", "K", "L"],
      noteSpeed: 350,
      noteSpawnRate: 400,
      maxWrongKeys: 1,
      maxMissedNotes: 3,
      difficulty: "normal"
    };
    var currentMode = "standard";
    var awaitingRetry = false;
    var customConfig = null;

    function cfgForMode(mode) {
      if (mode === "custom" && customConfig) {
        return Object.assign({}, BASE, customConfig);
      }
      var cfg = Object.assign({}, BASE);
      if (mode === "unlimited") {
        cfg.unlimited = true;
      } else if (mode === "standard") {
        cfg.requiredNotes = 45;
        cfg.speedTier = 3;
      }
      return cfg;
    }

    function readCustomForm() {
      var session = document.getElementById("custom-session").value;
      return {
        speedTier: Number(document.getElementById("custom-speed").value),
        forgiving: document.getElementById("custom-forgiving").value,
        unlimited: session === "unlimited",
        requiredNotes: session === "goal45" ? 45 : undefined
      };
    }

    function startRound() {
      awaitingRetry = false;
      document.getElementById("result").textContent = "";
      document.getElementById("result").className = "";
      rhythmPracticeFunctions.stop();
      rhythmPracticeFunctions.setup(cfgForMode(currentMode));
      var el = document.getElementById("rhythm-container");
      el.classList.add("active");
      el.style.display = "flex";
      rhythmPracticeFunctions.start();
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll(".mode-btn").forEach(function (b) {
        b.classList.toggle("is-active", b.dataset.mode === mode);
      });
      document.getElementById("custom-panel").classList.toggle("is-visible", mode === "custom");
      if (mode !== "custom") {
        startRound();
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".mode-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          setMode(btn.dataset.mode);
        });
      });

      document.getElementById("custom-start").addEventListener("click", function () {
        customConfig = readCustomForm();
        startRound();
      });

      startRound();

      window.addEventListener("practice:gameResult", function (e) {
        awaitingRetry = true;
        var r = document.getElementById("result");
        if (e.detail.unlimited || e.detail.forgiving) {
          var msg = (e.detail.success ? "SUCCESS — " : "") + "Hits: " + (e.detail.notesHit || 0);
          if (e.detail.speedTier) msg += " · Speed " + e.detail.speedTier + "×";
          if (e.detail.isNewBest) msg += " — NEW BEST!";
          else if (e.detail.bestScore > 0) msg += " · Best: " + e.detail.bestScore;
          r.textContent = msg + " — press SPACE to retry";
          r.className = e.detail.success ? "ok" : "fail";
          return;
        }
        r.textContent = e.detail.success
          ? "SUCCESS — press SPACE to play again"
          : "FAILED — press SPACE to retry";
        r.className = e.detail.success ? "ok" : "fail";
      });

      document.addEventListener("keydown", function (e) {
        if ((e.key === " " || e.code === "Space") && awaitingRetry) {
          e.preventDefault();
          startRound();
        }
      });
    });
  </script>
</body>
</html>
