<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thermite Door Practice</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/practice.css">
  <style>
    body.thermite-page {
      margin: 0;
      min-height: 100vh;
      background: #0b0a08;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }
    a.back {
      position: fixed;
      top: 1rem;
      left: 1rem;
      color: var(--primary-color, #d4af37);
      text-decoration: none;
      z-index: 10;
    }
    a.back:hover { text-decoration: underline; }
    .mode-picker {
      width: 600px;
      max-width: 96vw;
      margin-bottom: 1rem;
      display: flex;
      gap: 0.75rem;
    }
    .mode-btn {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: linear-gradient(135deg, rgba(15, 30, 45, 0.95), rgba(30, 60, 90, 0.95));
      color: #e0e0e0;
      font-family: 'Share Tech Mono', Consolas, monospace;
      cursor: pointer;
      text-align: left;
    }
    .mode-btn strong { display: block; color: var(--primary-color, #d4af37); margin-bottom: 0.2rem; }
    .mode-btn span { font-size: 12px; color: rgba(255,255,255,0.55); }
    .mode-btn.is-active {
      border-color: var(--primary-color, #d4af37);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.35);
    }
    #rhythm-container { display: none; }
    #rhythm-container.active { display: flex !important; }
    #result {
      margin-top: 1rem;
      font-family: 'Share Tech Mono', Consolas, monospace;
      font-weight: 600;
      min-height: 1.5rem;
      text-align: center;
    }
    #result.ok { color: var(--primary-color, #d4af37); }
    #result.fail { color: var(--failure-color, #b22222); }
  </style>
</head>
<body class="thermite-page theme-classic">
  <a class="back" href="index.html">← All practice games</a>

  <div class="mode-picker" id="mode-picker">
    <button type="button" class="mode-btn is-active" data-mode="standard">
      <strong>In-game (45 hits)</strong>
      <span>Same as ammunation job</span>
    </button>
    <button type="button" class="mode-btn" data-mode="unlimited">
      <strong>Unlimited</strong>
      <span>No hit cap · score counter</span>
    </button>
  </div>

  <div id="rhythm-container" class="game-container">
    <div class="rhythm-display">
      <div class="rhythm-highway"></div>
      <div class="hit-zone"></div>
      <div class="key-indicators"></div>
    </div>
    <div class="hack-info">
      <div class="message"><span id="rhythm-message">Hit the keys right in time</span></div>
    </div>
    <div class="timer-container">
      <div class="timer-bar">
        <div class="rhythm-progress"></div>
      </div>
      <div class="timer-text" id="rhythm-timer-label">Progress: <span id="rhythm-progress">0</span>%</div>
    </div>
    <div class="key-help">
      <div id="rhythm-key-hint">Press keys to match falling notes</div>
    </div>
  </div>

  <div id="result"></div>

  <div class="audio-elements" style="display: none;">
    <audio id="sound-click" preload="auto" src="sounds/click.mp3"></audio>
    <audio id="sound-success" preload="auto" src="sounds/success.mp3"></audio>
    <audio id="sound-failure" preload="auto" src="sounds/failure.mp3"></audio>
    <audio id="sound-penalty" preload="auto" src="sounds/penalty.mp3"></audio>
    <audio id="sound-buttonPress" preload="auto" src="sounds/buttonPress.mp3"></audio>
  </div>

  <script src="js/practice-bridge.js"></script>
  <script src="js/theme-config.js"></script>
  <script src="js/apply-theme.js"></script>
  <script src="js/asset-base.js"></script>
  <script src="js/sounds.js"></script>
  <script src="js/jquery-3.6.0.min.js"></script>
  <script src="js/rhythm.js"></script>
  <script>
    var BASE = {
      lanes: 6,
      keys: ["A", "S", "D", "J", "K", "L"],
      noteSpeed: 350,
      noteSpawnRate: 400,
      maxWrongKeys: 1,
      maxMissedNotes: 3,
      difficulty: "normal"
    };
    var currentMode = "standard";
    var awaitingRetry = false;

    function cfgForMode(mode) {
      var cfg = Object.assign({}, BASE);
      if (mode === "unlimited") {
        cfg.unlimited = true;
      } else {
        cfg.requiredNotes = 45;
      }
      return cfg;
    }

    function startRound() {
      awaitingRetry = false;
      document.getElementById("result").textContent = "";
      document.getElementById("result").className = "";
      rhythmPracticeFunctions.stop();
      rhythmPracticeFunctions.setup(cfgForMode(currentMode));
      var el = document.getElementById("rhythm-container");
      el.classList.add("active");
      el.style.display = "flex";
      rhythmPracticeFunctions.start();
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".mode-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
          currentMode = btn.dataset.mode;
          document.querySelectorAll(".mode-btn").forEach(function (b) {
            b.classList.toggle("is-active", b === btn);
          });
          startRound();
        });
      });

      startRound();

      window.addEventListener("practice:gameResult", function (e) {
        awaitingRetry = true;
        var r = document.getElementById("result");
        if (e.detail.unlimited) {
          var msg = "Score: " + (e.detail.notesHit || 0);
          if (e.detail.isNewBest) msg += " — NEW BEST!";
          else if (e.detail.bestScore > 0) msg += " · Best: " + e.detail.bestScore;
          r.textContent = msg + " — press SPACE to retry";
          r.className = "fail";
          return;
        }
        r.textContent = e.detail.success
          ? "SUCCESS — press SPACE to play again"
          : "FAILED — press SPACE to retry";
        r.className = e.detail.success ? "ok" : "fail";
      });

      document.addEventListener("keydown", function (e) {
        if ((e.key === " " || e.code === "Space") && awaitingRetry) {
          e.preventDefault();
          startRound();
        }
      });
    });
  </script>
</body>
</html>
